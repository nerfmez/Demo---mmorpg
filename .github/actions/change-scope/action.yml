name: Classify changed files
description: Select checks from the PR or push diff without skipping required check names.
inputs:
  force-render:
    description: Run renderer checks for an explicitly requested review ref.
    default: 'false'
  force-full:
    description: Run the complete regression inventory after merge or on request.
    default: 'false'
outputs:
  game:
    value: ${{ steps.classify.outputs.game }}
  tools:
    value: ${{ steps.classify.outputs.tools }}
  ui:
    value: ${{ steps.classify.outputs.ui }}
  hud:
    value: ${{ steps.classify.outputs.hud }}
  render:
    value: ${{ steps.classify.outputs.render }}
  map:
    value: ${{ steps.classify.outputs.map }}
  browser-suites:
    value: ${{ steps.classify.outputs.browser_suites }}
  browser-reason:
    value: ${{ steps.classify.outputs.browser_reason }}
runs:
  using: composite
  steps:
    - id: classify
      shell: bash
      env:
        FORCE_RENDER: ${{ inputs.force-render }}
        FORCE_FULL: ${{ inputs.force-full }}
      run: node scripts/ci-scope.mjs
