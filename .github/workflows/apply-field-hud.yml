name: Apply verified combat HUD
on:
  push:
    branches: [codex/seeker-clean-combat-hud]
    paths: [.github/fieldhud.b64]
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/seeker-clean-combat-hud'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and apply exact presentation-only patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          packed = base64.b64decode(pathlib.Path('.github/fieldhud.b64').read_text(), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '3a6f23ef3ae2f8a546d9062799c56c0cf5434be8a371f6d63703624547faa2ba'
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '7d04462907a1e848ada3d93176c91f0c7f2ff821f57218db0e223f181bc1032f'
          subprocess.run(['git','merge-base','--is-ancestor','1a0207048f8f3306d624d0097b5ee87007786d48','HEAD'],check=True)
          pathlib.Path('/tmp/fieldhud.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/fieldhud.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/fieldhud.patch'],check=True)
          allowed = {'docs/COMBAT-HUD.md','docs/DESIGN-STATUS.md','docs/GODOT-PORT.md','index.html','src/ui/fieldhud.css','src/ui/fieldhud.js','src/ui/hud.js','src/ui/input.js','tests/browser/fieldhud.mjs','tests/core/fieldhud.test.js'}
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed == allowed, changed
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit source on review branch only and remove temporary transport
        id: commit
        run: |
          git rm .github/fieldhud.b64 .github/workflows/apply-field-hud.yml .github/workflows/hud-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement clean Seeker combat HUD from approved reference'
          git push origin HEAD:refs/heads/codex/seeker-clean-combat-hud
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  browser:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/browser/fieldhud.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-hud-${{ matrix.browser }}
          path: tests/browser/out/fieldhud-${{ matrix.browser }}/
          retention-days: 7
