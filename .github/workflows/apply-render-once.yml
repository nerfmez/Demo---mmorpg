name: Apply and verify renderer pass
on:
  push:
    branches: [codex/render-light-shadow-pass]
    paths: [.github/workflows/apply-render-once.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/render-light-shadow-pass'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/render-light-shadow-pass
          fetch-depth: 0
      - name: Apply exact locally tested patch within renderer scope
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,zlib,hashlib,subprocess,pathlib
          p=zlib.decompress(base64.b64decode(pathlib.Path('.review/render-existing.b64').read_text()))
          assert hashlib.sha256(p).hexdigest()=='7659efe3cd3153b2d8d170883ae52edf62dbf379ab1a0fad13b47658180436a3'
          allowed={'data/art.json','data/world.json','src/render/patch.js','src/render/view.js','src/render/anime-study.js','src/render/environment.js','src/render/skinned.js','src/render/monsterSkin.js','docs/GODOT-PORT.md'}
          paths={line[6:] for line in p.decode().splitlines() if line.startswith('+++ b/')}
          assert paths==allowed,paths
          subprocess.run(['git','merge-base','--is-ancestor','58bc3db4f929eb699b2e5d40fac43638b0151ccb','HEAD'],check=True)
          subprocess.run(['git','apply','--check','-'],input=p,check=True)
          subprocess.run(['git','apply','-'],input=p,check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test && npm run build && git diff --check
      - name: Commit to the review branch only and remove temporary transport
        id: commit
        run: |
          rm -f .review/render-existing.b64 .github/workflows/render-runtime-once.yml .github/workflows/apply-render-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data src/render docs/GODOT-PORT.md .review .github/workflows
          git commit -m 'feat: unify lighting, fix quality transitions and match actor/foliage shadows'
          git push origin HEAD:codex/render-light-shadow-pass
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    uses: ./.github/workflows/render-light.yml
    with:
      review_ref: ${{ needs.apply.outputs.sha }}
