name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser smoke test (Chromium)
        run: npm run test:browser
      - name: Browser smoke test (WebKit, like iPad Safari)
        run: BROWSER=webkit npm run test:browser
      - name: Game UI workflows (Chromium, desktop/tablet/phone)
        run: npm run test:ux
      - name: Game UI workflows (WebKit, desktop/tablet/phone)
        run: BROWSER=webkit npm run test:ux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/browser/out/
