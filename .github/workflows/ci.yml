name: CI

on:
  push:
    branches-ignore: ['jev/request/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Chromium and WebKit (the iPad Safari engine) run side by side instead of one after the other.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:tools
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser smoke test
        run: npm run test:browser
      - name: Game UI workflows (desktop/tablet/phone)
        run: npm run test:ux
      - name: Harbor walkthrough and art review captures
        run: node tests/browser/capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.browser }}
          path: tests/browser/out/
