name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      quick_gate:
        type: boolean
        default: false
    outputs:
      source:
        value: ${{ jobs.prepare.outputs.source }}
      artifact:
        value: ${{ jobs.prepare.outputs.artifact }}
permissions:
  contents: read
  actions: read
concurrency:
  # New PR revisions may cancel stale quick gates; each main SHA keeps its full run.
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'pull_request' || inputs.quick_gate) && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.quick_gate == true }}
jobs:
  prepare:
    name: Build, core and CI tools
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.scope.outputs.game }}
      suites: ${{ steps.scope.outputs.browser-suites }}
      reason: ${{ steps.scope.outputs.browser-reason }}
      source: ${{ steps.source.outputs.sha }}
      artifact: ${{ steps.source.outputs.artifact }}
      matrix: ${{ steps.reviews.outputs.matrix }}
      review-source: ${{ steps.reviews.outputs.review_source }}
      review-tree: ${{ steps.reviews.outputs.review_tree }}
      review-mode: ${{ steps.reviews.outputs.review_mode }}
      ui-suites: ${{ steps.reviews.outputs.ui_suites }}
      hud-suites: ${{ steps.reviews.outputs.hud_suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PR reports and artifacts refer to its exact head, not a synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: source
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact=ci-dist-$sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Fetch the event merge revision
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: scope
        uses: ./.github/actions/change-scope
        with:
          force-full: ${{ github.event_name != 'pull_request' && !inputs.quick_gate }}
          force-boot: ${{ inputs.quick_gate }}
      - id: reviews
        name: Plan shared execution and explicit merge review
        env:
          CI_SUITES: ${{ steps.scope.outputs.browser-suites }}
          CI_MODE: ${{ (github.event_name == 'pull_request' || inputs.quick_gate) && 'quick' || 'full' }}
        run: node scripts/ci-review-plan.mjs
      - name: Validation plan and exact source
        env:
          SOURCE: ${{ steps.source.outputs.sha }}
          SUITES: ${{ steps.scope.outputs.browser-suites }}
          REASON: ${{ steps.scope.outputs.browser-reason }}
          MODE: ${{ (github.event_name == 'pull_request' || inputs.quick_gate) && 'Quick gate' || 'Full regression' }}
        run: |
          echo "$MODE source: $SOURCE" >> "$GITHUB_STEP_SUMMARY"
          echo "Browser suites (each in Chromium and WebKit): $SUITES" >> "$GITHUB_STEP_SUMMARY"
          echo "Routing: $REASON" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run test:tools
        if: steps.scope.outputs.game == 'true' || steps.scope.outputs.tools == 'true'
      # All core tests, including migrations, save preservation and contact timing.
      - run: npm test
        if: steps.scope.outputs.game == 'true'
      - run: npm run build
        if: steps.scope.outputs.game == 'true'
      - name: Verify published Lab can be preserved
        if: github.event_name == 'pull_request' && steps.scope.outputs.tools == 'true' && steps.reviews.outputs.ui_suites != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preserve-published-lab.mjs lab-preservation-check
      - name: Bind CI event and workflow to build
        if: steps.scope.outputs.game == 'true'
        env:
          CI_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if [ -f scripts/ci-release-evidence.mjs ]; then
            node scripts/ci-release-evidence.mjs --write-context
          else
            echo "Legacy PR head: no reusable context receipt; normal checks continue."
          fi
      - name: Bind build to the tested source
        if: steps.scope.outputs.game == 'true'
        env:
          SOURCE: ${{ steps.source.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test -s dist/index.html
          printf '%s\n' "$SOURCE" > dist/ci-source.txt
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.game == 'true'
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: dist/
          retention-days: 3
          if-no-files-found: error

      - name: Build distinct merge review source
        if: steps.reviews.outputs.merge_suites != '[]'
        env:
          MERGE_SOURCE: ${{ steps.reviews.outputs.merge_source }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/merge-review" "$MERGE_SOURCE"
          cd "$RUNNER_TEMP/merge-review"
          npm ci
          npm run build
          test "$(git rev-parse HEAD)" = "$MERGE_SOURCE"
          test -s dist/index.html
          printf '%s\n' "$MERGE_SOURCE" > dist/ci-source.txt
      - uses: actions/upload-artifact@v4
        if: steps.reviews.outputs.merge_suites != '[]'
        with:
          name: ci-dist-${{ steps.reviews.outputs.merge_source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/merge-review/dist/
          retention-days: 3
          if-no-files-found: error

  browser:
    name: ${{ matrix.label }} (${{ matrix.browser }}, ${{ matrix.suite }})
    needs: prepare
    if: needs.prepare.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Use available hosted capacity; the account scheduler still enforces its limit.
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      BROWSER: ${{ matrix.browser }}
      CI_SOURCE_SHA: ${{ matrix.source }}
      CI_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
      - name: Verify downloaded build source
        run: test "$(cat dist/ci-source.txt)" = "$CI_SOURCE_SHA"
      - id: browser-host
        name: Identify browser cache platform
        run: |
          . /etc/os-release
          echo "host=$ID-$VERSION_ID-${{ runner.arch }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.browser-host.outputs.host }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run complete selected shard with timings
        run: node scripts/ci-browser-run.mjs ${{ matrix.suite }}
      - name: Upload selected browser report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-report-${{ env.CI_MODE }}-${{ matrix.source }}-${{ matrix.browser }}-${{ matrix.suite }}-${{ github.run_attempt }}
          path: tests/browser/out/ci/${{ env.CI_MODE }}-${{ matrix.browser }}-${{ matrix.suite }}.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ env.CI_MODE }}-${{ matrix.source }}-${{ matrix.browser }}-${{ matrix.suite }}-${{ github.run_attempt }}
          path: tests/browser/out/
          retention-days: 7
          if-no-files-found: error

  review:
    name: review (${{ matrix.browser }})
    needs: [prepare, browser]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        if: needs.prepare.result == 'success'
        with:
          ref: ${{ needs.prepare.outputs.review-source }}
      - uses: actions/setup-node@v4
        if: needs.prepare.result == 'success'
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: needs.prepare.result == 'success' && needs.browser.result == 'success' && needs.prepare.outputs.ui-suites != '[]'
        with:
          pattern: ci-report-${{ needs.prepare.outputs.review-mode }}-${{ needs.prepare.outputs.review-source }}-${{ matrix.browser }}-*-${{ github.run_attempt }}
          path: gate-reports/
          merge-multiple: true
      - name: Verify shared UI evidence at head or merge tree
        env:
          PREPARE: ${{ needs.prepare.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CI_SOURCE_SHA: ${{ needs.prepare.outputs.review-source }}
          CI_TREE: ${{ needs.prepare.outputs.review-tree }}
          BROWSER: ${{ matrix.browser }}
          CI_SUITES: ${{ needs.prepare.outputs.ui-suites }}
          CI_MODE: ${{ needs.prepare.outputs.review-mode }}
        run: |
          test "$PREPARE" = success
          test "$(git rev-parse HEAD)" = "$CI_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CI_TREE"
          test -n "$CI_SUITES"
          if [ "$CI_SUITES" != '[]' ]; then
            test "$BROWSER_RESULT" = success
            node scripts/ci-browser-gate.mjs
          fi
          echo "UI source=$CI_SOURCE_SHA tree=$CI_TREE suites=$CI_SUITES mode=$CI_MODE" >> "$GITHUB_STEP_SUMMARY"

  field-hud:
    name: field-hud (${{ matrix.browser }})
    needs: [prepare, browser]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        if: needs.prepare.result == 'success'
        with:
          ref: ${{ needs.prepare.outputs.review-source }}
      - uses: actions/setup-node@v4
        if: needs.prepare.result == 'success'
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: needs.prepare.result == 'success' && needs.browser.result == 'success' && needs.prepare.outputs.hud-suites != '[]'
        with:
          pattern: ci-report-${{ needs.prepare.outputs.review-mode }}-${{ needs.prepare.outputs.review-source }}-${{ matrix.browser }}-*-${{ github.run_attempt }}
          path: gate-reports/
          merge-multiple: true
      - name: Verify shared HUD evidence at head or merge tree
        env:
          PREPARE: ${{ needs.prepare.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CI_SOURCE_SHA: ${{ needs.prepare.outputs.review-source }}
          CI_TREE: ${{ needs.prepare.outputs.review-tree }}
          BROWSER: ${{ matrix.browser }}
          CI_SUITES: ${{ needs.prepare.outputs.hud-suites }}
          CI_MODE: ${{ needs.prepare.outputs.review-mode }}
        run: |
          test "$PREPARE" = success
          test "$(git rev-parse HEAD)" = "$CI_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CI_TREE"
          test -n "$CI_SUITES"
          if [ "$CI_SUITES" != '[]' ]; then
            test "$BROWSER_RESULT" = success
            node scripts/ci-browser-gate.mjs
          fi
          echo "HUD source=$CI_SOURCE_SHA tree=$CI_TREE suites=$CI_SUITES mode=$CI_MODE" >> "$GITHUB_STEP_SUMMARY"

  # Preserve required names. Both summaries fail if ANY selected shard fails,
  # is cancelled, or is unexpectedly skipped. Failures cannot be waived.
  test:
    name: test (${{ matrix.browser }})
    needs: [prepare, browser]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        if: needs.prepare.result == 'success' && needs.browser.result == 'success' && needs.prepare.outputs.game == 'true'
        with:
          ref: ${{ needs.prepare.outputs.source }}
      - uses: actions/setup-node@v4
        if: needs.prepare.result == 'success' && needs.browser.result == 'success' && needs.prepare.outputs.game == 'true'
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: needs.prepare.result == 'success' && needs.browser.result == 'success' && needs.prepare.outputs.game == 'true'
        with:
          pattern: ci-report-${{ (github.event_name == 'pull_request' || inputs.quick_gate) && 'quick' || 'full' }}-${{ needs.prepare.outputs.source }}-${{ matrix.browser }}-*-${{ github.run_attempt }}
          path: gate-reports/
          merge-multiple: true
      - name: Verify complete selected browser evidence
        if: needs.prepare.result == 'success' && needs.browser.result == 'success' && needs.prepare.outputs.game == 'true'
        env:
          CI_SOURCE_SHA: ${{ needs.prepare.outputs.source }}
          BROWSER: ${{ matrix.browser }}
          CI_SUITES: ${{ needs.prepare.outputs.suites }}
          CI_MODE: ${{ (github.event_name == 'pull_request' || inputs.quick_gate) && 'quick' || 'full' }}
        run: node scripts/ci-browser-gate.mjs
      - name: Report gate outcome at exact source
        env:
          PREPARE: ${{ needs.prepare.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          GAME: ${{ needs.prepare.outputs.game }}
          SOURCE: ${{ needs.prepare.outputs.source }}
          SUITES: ${{ needs.prepare.outputs.suites }}
          MODE: ${{ (github.event_name == 'pull_request' || inputs.quick_gate) && 'Quick gate (affected suite; not a full-suite certification)' || 'Full regression' }}
        run: |
          echo "$MODE: $SOURCE; suites=$SUITES; prepare=$PREPARE; browser=$BROWSER_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$PREPARE" = success
          test -n "$SOURCE"
          if [ "$GAME" = true ]; then
            test -n "$SUITES"
            test "$SUITES" != '[]'
            test "$BROWSER_RESULT" = success
          elif [ "$GAME" = false ]; then
            test "$SUITES" = '[]'
            test "$BROWSER_RESULT" = skipped
          else
            exit 1
          fi
