name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      quick_gate:
        type: boolean
        default: false
    outputs:
      source:
        value: ${{ jobs.prepare.outputs.source }}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    name: Build, core and CI tools
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.scope.outputs.game }}
      suites: ${{ steps.scope.outputs.browser-suites }}
      reason: ${{ steps.scope.outputs.browser-reason }}
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PR reports and artifacts refer to its exact head, not a synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: scope
        uses: ./.github/actions/change-scope
        with:
          force-full: ${{ github.event_name != 'pull_request' && !inputs.quick_gate }}
      - name: Validation plan and exact source
        env:
          SOURCE: ${{ steps.source.outputs.sha }}
          SUITES: ${{ steps.scope.outputs.browser-suites }}
          REASON: ${{ steps.scope.outputs.browser-reason }}
          MODE: ${{ (github.event_name == 'pull_request' || inputs.quick_gate) && 'Quick gate' || 'Full regression' }}
        run: |
          echo "$MODE source: $SOURCE" >> "$GITHUB_STEP_SUMMARY"
          echo "Browser suites (each in Chromium and WebKit): $SUITES" >> "$GITHUB_STEP_SUMMARY"
          echo "Routing: $REASON" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.game == 'true' || steps.scope.outputs.tools == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.game == 'true' || steps.scope.outputs.tools == 'true'
      - run: npm run test:tools
        if: steps.scope.outputs.tools == 'true'
      # All core tests, including migrations, save preservation and contact timing.
      - run: npm test
        if: steps.scope.outputs.game == 'true'
      - run: npm run build
        if: steps.scope.outputs.game == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.game == 'true'
        with:
          name: ci-dist-${{ steps.source.outputs.sha }}
          path: dist/
          retention-days: 3

  browser:
    name: ${{ (github.event_name == 'pull_request' || inputs.quick_gate) && 'Quick affected' || 'Full regression' }} (${{ matrix.browser }}, ${{ matrix.suite }})
    needs: prepare
    if: needs.prepare.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        browser: [chromium, webkit]
        suite: ${{ fromJSON(needs.prepare.outputs.suites) }}
    env:
      BROWSER: ${{ matrix.browser }}
      CI_SOURCE_SHA: ${{ needs.prepare.outputs.source }}
      CI_MODE: ${{ (github.event_name == 'pull_request' || inputs.quick_gate) && 'quick' || 'full' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ci-dist-${{ needs.prepare.outputs.source }}
          path: dist/
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run complete selected shard with timings
        run: node scripts/ci-browser-run.mjs ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ env.CI_MODE }}-${{ needs.prepare.outputs.source }}-${{ matrix.browser }}-${{ matrix.suite }}
          path: tests/browser/out/
          retention-days: 7

  # Preserve required names. Both summaries fail if ANY selected shard fails,
  # is cancelled, or is unexpectedly skipped. Failures cannot be waived.
  test:
    name: test (${{ matrix.browser }})
    needs: [prepare, browser]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Report gate outcome at exact source
        env:
          PREPARE: ${{ needs.prepare.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          GAME: ${{ needs.prepare.outputs.game }}
          SOURCE: ${{ needs.prepare.outputs.source }}
          SUITES: ${{ needs.prepare.outputs.suites }}
          MODE: ${{ (github.event_name == 'pull_request' || inputs.quick_gate) && 'Quick gate (affected suite; not a full-suite certification)' || 'Full regression' }}
        run: |
          echo "$MODE: $SOURCE; suites=$SUITES; prepare=$PREPARE; browser=$BROWSER_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$PREPARE" = success
          if [ "$GAME" = true ]; then
            test "$BROWSER_RESULT" = success
          else
            test "$BROWSER_RESULT" = skipped
          fi
