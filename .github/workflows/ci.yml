name: CI

# Feature branches are validated on PRs; main pushes still validate the merged source.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - name: Validation scope
        run: echo 'Game=${{ steps.scope.outputs.game }}; tools=${{ steps.scope.outputs.tools }}; UI=${{ steps.scope.outputs.ui }}; map=${{ steps.scope.outputs.map }}'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.game == 'true' || steps.scope.outputs.tools == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.game == 'true' || steps.scope.outputs.tools == 'true'
      - run: npm run test:tools
        if: steps.scope.outputs.tools == 'true'
      - run: npm test
        if: steps.scope.outputs.game == 'true'
      - run: npm run build
        if: steps.scope.outputs.game == 'true'
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        if: steps.scope.outputs.game == 'true'
      - name: Browser smoke test
        if: steps.scope.outputs.game == 'true'
        run: npm run test:browser
      - name: Map travel round trip with a reload (seam crossing with streaming off, saved slot)
        if: steps.scope.outputs.game == 'true'
        run: node tests/browser/map-travel.mjs
      - name: Open world (stream the neighbouring map in, cross the seam without a reload, drop it again)
        if: steps.scope.outputs.game == 'true'
        run: node tests/browser/open-world.mjs
      - name: Open world from the Frontier (Azure's city and harbour stream in at Azure's place)
        if: steps.scope.outputs.game == 'true'
        run: node tests/browser/open-world-city.mjs
      - name: Mid/high monsters (wind-up, contact and recovery from the game camera, field guide)
        if: steps.scope.outputs.game == 'true'
        run: node tests/browser/midhigh-monsters.mjs
      - name: Two hands, gloves, shields and arrows (hero model, equipment screen, arrow crafting)
        if: steps.scope.outputs.game == 'true'
        run: node tests/browser/gear-hands.mjs
      - name: Approved weapon originals (equip, save, shots, captures and resource stability)
        if: steps.scope.outputs.game == 'true'
        run: |
          node tests/browser/weapon-loading.mjs
          node tests/browser/weapon-models.mjs
      - name: Shop, potions and quick item slots (buy at the shopkeeper, drink from the HUD)
        if: steps.scope.outputs.game == 'true'
        run: node tests/browser/shop-potions.mjs
      - name: Potions while walking (independent pointers, cooldown and cancellation)
        if: steps.scope.outputs.game == 'true'
        run: node tests/browser/potions-moving.mjs
      - name: Equipment details (touch scrolling, visible close, upgrade materials)
        if: steps.scope.outputs.game == 'true'
        run: node tests/browser/details-touch.mjs
      - name: Main menu (hub, grouped pages, back buttons, Esc)
        if: steps.scope.outputs.game == 'true'
        run: node tests/browser/menu-hub.mjs
      - name: Distinct coastal attack patterns and contact poses
        if: steps.scope.outputs.game == 'true'
        run: node tests/browser/coastal-attacks.mjs
      - name: Skill Lab smoke (lab.html casts and hits)
        if: steps.scope.outputs.game == 'true'
        run: node tests/browser/lab.mjs
      - name: Game UI workflows (desktop/tablet/phone)
        if: steps.scope.outputs.ui == 'true'
        run: npm run test:ux
      - name: Harbor walkthrough and art review captures
        if: steps.scope.outputs.map == 'true'
        run: node tests/browser/capture.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.game == 'true'
        with:
          name: screenshots-${{ matrix.browser }}
          path: tests/browser/out/
