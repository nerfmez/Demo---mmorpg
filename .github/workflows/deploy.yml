name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/shared-conversation-s1yquy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Dreamloop against the published game (Safari engine)
        env:
          DREAMLOOP_URL: ${{ steps.deployment.outputs.page_url }}
          DREAMLOOP_PASS: live-webkit
          BROWSER: webkit
        run: npm run test:dreamloop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-dreamloop
          path: tests/browser/out/dreamloop-live-webkit/
