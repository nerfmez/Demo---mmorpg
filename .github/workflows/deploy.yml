name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # an effects branch built the Skill Lab: publish the game from main and that lab under /lab/
  workflow_run:
    workflows: ['Skill Lab preview']
    types: [completed]
  workflow_dispatch:
    inputs:
      rollback_run:
        description: 'Explicit successful Pages run ID to restore exactly (blank = release main)'
        type: string
        default: ''
      rollback_previous:
        description: 'Restore the previous-site checkpoint saved by rollback_run (requires that run ID)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  # Active publication finishes. GitHub keeps at most one pending run; a newer
  # arrival replaces that pending run, and ordering is not guaranteed (not FIFO).
  cancel-in-progress: false

jobs:
  evidence:
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && !inputs.rollback_run
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.previous.outputs.sha }}
      reuse: ${{ steps.resolve.outputs.reuse }}
      source: ${{ steps.resolve.outputs.source }}
      target: ${{ steps.resolve.outputs.target }}
      tree: ${{ steps.resolve.outputs.tree }}
      run: ${{ steps.resolve.outputs.run }}
      artifact: ${{ steps.resolve.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install release evidence dependencies
        run: npm ci --include=dev
      - id: previous
        name: Retain previous successful site and release baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-published-site.mjs checkpoint
      - uses: actions/upload-artifact@v4
        with:
          name: previous-site
          path: previous-site/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Reject stale release before validation
        if: github.event_name != 'workflow_run'
        env:
          RELEASE_BASE_SHA: ${{ steps.previous.outputs.sha }}
        run: git merge-base --is-ancestor "$RELEASE_BASE_SHA" HEAD
      - id: resolve
        name: Verify already-tested release evidence
        env:
          RELEASE_BASE_SHA: ${{ steps.previous.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-release-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.reuse == 'true'
        with:
          name: ${{ steps.resolve.outputs.artifact }}
          path: release-dist/
          retention-days: 3
          if-no-files-found: error
  validate:
    needs: evidence
    if: always() && !cancelled() && needs.evidence.result == 'success' && github.ref == 'refs/heads/main' && !inputs.rollback_run && github.event_name != 'workflow_run' && !(needs.evidence.result == 'success' && needs.evidence.outputs.reuse == 'true')
    uses: ./.github/workflows/ci.yml
    with:
      quick_gate: true
      release_base: ${{ needs.evidence.outputs.base }}
  build:
    needs: [evidence, validate]
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.evidence.result == 'success' || inputs.rollback_run != '') && ((github.event_name == 'workflow_dispatch' && inputs.rollback_run != '') || (github.event_name == 'workflow_run' && needs.evidence.result == 'success' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.id == github.repository_id) || needs.validate.result == 'success' || (needs.evidence.result == 'success' && needs.evidence.outputs.reuse == 'true' && needs.validate.result == 'skipped'))
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.restore.outputs.sha || steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source || needs.evidence.outputs.target || github.sha }}
      - id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Download either the verified prior CI build or the normal fallback build.
      - uses: actions/download-artifact@v4
        if: github.event_name != 'workflow_run' && !inputs.rollback_run
        with:
          name: ${{ needs.validate.outputs.artifact || needs.evidence.outputs.artifact }}
          path: dist/
      - name: Verify the build before Pages upload
        if: github.event_name != 'workflow_run' && !inputs.rollback_run
        env:
          BUILD_ORIGIN: ${{ needs.validate.outputs.source || needs.evidence.outputs.source }}
          RELEASE_TARGET: ${{ needs.validate.outputs.source || needs.evidence.outputs.target }}
          RELEASE_TREE: ${{ needs.evidence.outputs.tree }}
          EVIDENCE_RUN: ${{ needs.validate.result == 'skipped' && needs.evidence.outputs.run || '' }}
        run: node scripts/ci-release-evidence.mjs --verify-build
      # A Lab event changes only /lab. Rollback restores the complete prior site.
      - id: restore
        name: Restore exact published site
        if: github.event_name == 'workflow_run' || inputs.rollback_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_RUN: ${{ inputs.rollback_run }}
          ROLLBACK_PREVIOUS: ${{ inputs.rollback_previous }}
          RESTORE_MODE: ${{ inputs.rollback_run != '' && 'rollback' || 'lab' }}
        run: node scripts/ci-published-site.mjs "$RESTORE_MODE"
      # Preserve the exact already-published /lab preview on main releases.
      - name: Preserve published Skill Lab
        if: github.event_name != 'workflow_run' && !inputs.rollback_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-published-site.mjs preserve-lab
      - name: Skill Lab from the effects branch
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: lab-dist
          path: lab-out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Attach separately validated Skill Lab
        if: inputs.rollback_run == ''
        run: |
          rm -rf dist/lab
          mv lab-out dist/lab
          node scripts/ci-published-site.mjs seal
      - run: node scripts/ci-published-site.mjs verify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 90
  deploy:
    needs: build
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --init --shm-size=1g
    env:
      BROWSER: webkit
      NODE_OPTIONS: --dns-result-order=ipv4first
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          # Use the reviewed live-check harness, including for pre-policy rollbacks.
          ref: ${{ github.sha }}
      - name: Trust exact checked-out container workspace
        run: |
          test "$GITHUB_WORKSPACE" = "$(pwd -P)"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify preinstalled Playwright matches locked dependencies
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const version = require('./package-lock.json').packages['node_modules/playwright'].version;
          const image = JSON.parse(fs.readFileSync('/ms-playwright/.docker-info', 'utf8'));
          assert.equal(require('playwright/package.json').version, version);
          assert.equal(require('playwright-core/package.json').version, version);
          assert.equal(image.driverVersion, version);
          assert.equal(image.dockerImageName, `mcr.microsoft.com/playwright:v${version}-noble`);
          assert.ok(['chromium', 'webkit'].includes(process.env.BROWSER));
          const executable = fs.realpathSync(require('playwright')[process.env.BROWSER].executablePath());
          assert.ok(executable.startsWith('/ms-playwright/'), executable);
          fs.accessSync(executable, fs.constants.X_OK);
          console.log(`Preinstalled Playwright ${version}: ${process.env.BROWSER} ${executable}`);
          NODE
      - name: Published startup save and Continue (Safari engine)
        env:
          BOOT_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_RELEASE: ${{ needs.build.outputs.source }}
          BROWSER: webkit
        run: node tests/browser/boot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-startup-save
          path: tests/browser/out/boot/
