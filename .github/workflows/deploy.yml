name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/shared-conversation-s1yquy]
  # an effects branch built the Skill Lab: publish the game from main and that lab under /lab/
  workflow_run:
    workflows: ['Skill Lab preview']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  evidence:
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
      source: ${{ steps.resolve.outputs.source }}
      target: ${{ steps.resolve.outputs.target }}
      tree: ${{ steps.resolve.outputs.tree }}
      run: ${{ steps.resolve.outputs.run }}
      artifact: ${{ steps.resolve.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install release evidence dependencies
        run: npm ci --include=dev
      - id: resolve
        name: Verify already-tested release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-release-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.reuse == 'true'
        with:
          name: ${{ steps.resolve.outputs.artifact }}
          path: release-dist/
          retention-days: 3
          if-no-files-found: error
  validate:
    needs: evidence
    if: always() && !cancelled() && github.event_name != 'workflow_run' && !(needs.evidence.result == 'success' && needs.evidence.outputs.reuse == 'true')
    uses: ./.github/workflows/ci.yml
    with:
      quick_gate: true
  build:
    needs: [evidence, validate]
    if: always() && !cancelled() && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || needs.validate.result == 'success' || (needs.evidence.result == 'success' && needs.evidence.outputs.reuse == 'true' && needs.validate.result == 'skipped'))
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source || needs.evidence.outputs.target || github.sha }}
      - id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Download either the verified prior CI build or the normal fallback build.
      - uses: actions/download-artifact@v4
        if: github.event_name != 'workflow_run'
        with:
          name: ${{ needs.validate.outputs.artifact || needs.evidence.outputs.artifact }}
          path: dist/
      - name: Verify the build before Pages upload
        if: github.event_name != 'workflow_run'
        env:
          BUILD_ORIGIN: ${{ needs.validate.outputs.source || needs.evidence.outputs.source }}
          RELEASE_TARGET: ${{ needs.validate.outputs.source || needs.evidence.outputs.target }}
          RELEASE_TREE: ${{ needs.evidence.outputs.tree }}
          EVIDENCE_RUN: ${{ needs.validate.result == 'skipped' && needs.evidence.outputs.run || '' }}
        run: node scripts/ci-release-evidence.mjs --verify-build
      # Lab-only publishing retains the existing main-game build path.
      - run: npm test && npm run build
        if: github.event_name == 'workflow_run'
      # Preserve the exact already-published /lab preview on main releases.
      - name: Preserve published Skill Lab
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preserve-published-lab.mjs lab-out
      - name: Skill Lab from the effects branch
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: lab-dist
          path: lab-out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: mv lab-out dist/lab
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: github.event_name != 'workflow_run'
      - run: npx playwright install --with-deps webkit
        if: github.event_name != 'workflow_run'
      - name: Dreamloop against the published game (Safari engine)
        if: github.event_name != 'workflow_run'
        env:
          DREAMLOOP_URL: ${{ steps.deployment.outputs.page_url }}
          DREAMLOOP_PASS: live-webkit
          BROWSER: webkit
        run: npm run test:dreamloop
      - name: Published atomic route purchase and reload (Safari engine)
        if: github.event_name != 'workflow_run'
        env:
          JOURNAL_SAVE_URL: ${{ steps.deployment.outputs.page_url }}?quality=low&release=${{ needs.build.outputs.source }}
          JOURNAL_OUT: tests/browser/out/journal-live-webkit/
          BROWSER: webkit
        run: node tests/browser/journal-route-save.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'workflow_run'
        with:
          name: live-dreamloop
          path: |
            tests/browser/out/dreamloop-live-webkit/
            tests/browser/out/journal-live-webkit/
