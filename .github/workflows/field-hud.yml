name: Seeker Combat HUD
on:
  # PR execution and the stable check names now belong to CI.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: field-hud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  field-hud:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - name: Validation scope
        run: echo 'Run focused review=${{ steps.scope.outputs.hud }}'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.hud == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.hud == 'true'
      - run: npm run build
        if: steps.scope.outputs.hud == 'true'
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        if: steps.scope.outputs.hud == 'true'
      - run: node tests/browser/fieldhud.mjs
        if: steps.scope.outputs.hud == 'true'
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.hud == 'true'
        with:
          name: field-hud-${{ matrix.browser }}
          path: tests/browser/out/fieldhud-${{ matrix.browser }}/
          retention-days: 7
