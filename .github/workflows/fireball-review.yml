name: Fireball visual review
on:
  pull_request:
    paths: ['src/render/fireball.js', 'src/render/vfx.js', 'data/combat-fx.json', 'tests/browser/fireball.mjs', '.github/workflows/fireball-review.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/browser/fireball.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fireball-${{ matrix.browser }}
          path: tests/browser/out/fireball/
