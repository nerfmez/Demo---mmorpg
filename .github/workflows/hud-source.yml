name: HUD Source Snapshot
on:
  push:
    branches: [codex/seeker-clean-combat-hud]
    paths: [.github/workflows/hud-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack source without credentials or git metadata
        run: |
          git rev-parse HEAD > /tmp/source-commit.txt
          tar --exclude=.git --exclude=node_modules/.cache -czf /tmp/seeker-current-source.tgz src data tests scripts docs public index.html package.json package-lock.json vite.config.js node_modules AGENTS.md
      - uses: actions/upload-artifact@v4
        with:
          name: seeker-current-source
          path: |
            /tmp/seeker-current-source.tgz
            /tmp/source-commit.txt
          retention-days: 2
