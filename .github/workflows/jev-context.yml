name: Jev Context

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What should ChatGPT / Claude change? Thai or English.'
        required: true
        type: string
      keywords:
        description: 'Optional English search terms, e.g. foliage bush leafpaint'
        type: string
      target_ref:
        description: 'Source branch or commit to inspect'
        default: main
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/jev-context.yml'
      - 'scripts/jev-context.mjs'
      - 'tests/tools/**'

permissions:
  contents: read
  actions: read

# Serialize paid runs, including retries, so they cannot race the monthly allowance check.
concurrency:
  group: jev-context-paid
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/tools/*.test.mjs

  context:
    needs: validate
    # A one-request live setup check on our own Jev integration branch; no fork secrets.
    # Other PRs run only the unpaid tests. Normal usage is an explicit manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'codex/jev-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the integration tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: tooling
          persist-credentials: false
      - name: Checkout the source to inspect
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.event.pull_request.base.sha || github.sha }}
          path: project
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compute exact cache identity
        id: identity
        env:
          JEV_TASK: ${{ inputs.task || 'Fix the EXP and Job EXP bars that sit too high on iPad. Preserve the game rules and improve field HUD spacing.' }}
          JEV_KEYWORDS: ${{ inputs.keywords || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const sha = execFileSync('git', ['-C', 'project', 'rev-parse', 'HEAD']).toString().trim();
          const digest = createHash('sha256').update(readFileSync('tooling/scripts/jev-context.mjs'))
            .update(JSON.stringify([process.env.JEV_TASK, process.env.JEV_KEYWORDS])).digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT, `key=jev-context-v1-${sha}-${digest}\n`);
          NODE
      - name: Restore decisions for the same source and task
        uses: actions/cache@v4
        with:
          path: .jev-cache
          key: ${{ steps.identity.outputs.key }}
      - name: Rank relevant source with Jev
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          JEV_PROJECT_ROOT: project
          JEV_OUTPUT_DIR: jev-out
          JEV_CACHE_DIR: .jev-cache
          JEV_TASK: ${{ inputs.task || 'Fix the EXP and Job EXP bars that sit too high on iPad. Preserve the game rules and improve field HUD spacing.' }}
          JEV_KEYWORDS: ${{ inputs.keywords || '' }}
        run: node tooling/scripts/jev-context.mjs
      - name: Upload shared context and usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: jev-out/
          retention-days: 14
          if-no-files-found: warn
