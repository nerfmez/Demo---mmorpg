name: Travel Journal Review
on:
  push:
    branches: [codex/seeker-ui-workspaces]
    paths: ['src/**', 'data/**', 'tests/**', '.github/workflows/journal-review.yml']
permissions:
  contents: read
concurrency:
  group: journal-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source without credentials
        run: git archive --format=tar.gz --output=/tmp/journal-source.tgz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: journal-source
          path: /tmp/journal-source.tgz
          retention-days: 2
