name: Skill Lab preview

# Isolated owner review of f8ae388. Full Chromium/WebKit checks continue
# on claude/vfx-physical-attacks; this preview branch is never merged.
on:
  push:
    branches: [claude/vfx-physical-owner-review-20261001]

permissions:
  contents: read

concurrency:
  group: physical-owner-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/core/combat.test.js tests/core/combat-fx.test.js tests/core/lab-tuning.test.js tests/core/physical-events.test.js
      - run: npm run build
      - name: Record review source
        run: printf '{"branch":"%s","sha":"%s","review":true,"checks":"36888603719"}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > dist/lab-source.json
      - uses: actions/upload-artifact@v4
        with:
          name: lab-dist
          path: dist/
          retention-days: 7
