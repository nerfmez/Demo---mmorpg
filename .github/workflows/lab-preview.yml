name: Skill Lab preview

# Builds the Skill Lab (lab.html) from an effects branch. When this succeeds, the Pages deploy
# (deploy.yml, which runs from main) publishes it at <site>/lab/lab.html, so the owner can try
# work-in-progress skill effects on the iPad without waiting for a merge or for screenshots.
on:
  push:
    branches: ['claude/vfx-**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/core/combat.test.js tests/core/combat-fx.test.js tests/core/lab-tuning.test.js
        if: startsWith(github.ref_name, 'claude/vfx-physical')
      - run: npm test
        if: "!startsWith(github.ref_name, 'claude/vfx-physical')"
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Firebolt Lab review (Chromium)
        if: "!startsWith(github.ref_name, 'claude/vfx-physical')"
        run: node tests/browser/firebolt-lab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firebolt-lab-chromium
          path: tests/browser/out/firebolt-lab/
          retention-days: 7
      - name: Firebolt Lab review (WebKit)
        if: "!startsWith(github.ref_name, 'claude/vfx-physical')"
        run: BROWSER=webkit node tests/browser/firebolt-lab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firebolt-lab-webkit
          path: tests/browser/out/firebolt-lab/
          retention-days: 7
      - name: Physical attack Lab (Chromium)
        if: startsWith(github.ref_name, 'claude/vfx-physical')
        run: node tests/browser/melee-lab.mjs
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(github.ref_name, 'claude/vfx-physical')
        with:
          name: melee-lab-chromium
          path: tests/browser/out/melee-lab/
          retention-days: 7
      - name: Physical attack Lab (WebKit)
        if: startsWith(github.ref_name, 'claude/vfx-physical')
        run: BROWSER=webkit node tests/browser/melee-lab.mjs
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(github.ref_name, 'claude/vfx-physical')
        with:
          name: melee-lab-webkit
          path: tests/browser/out/melee-lab/
          retention-days: 7
      - name: Shared Lab editor (Chromium)
        run: node tests/browser/lab-editor.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-editor-chromium
          path: tests/browser/out/lab-editor/
          retention-days: 7
      - name: Shared Lab editor (WebKit)
        run: BROWSER=webkit node tests/browser/lab-editor.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-editor-webkit
          path: tests/browser/out/lab-editor/
          retention-days: 7
      - name: Record which source the lab shows
        run: printf '{"branch":"%s","sha":"%s"}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > dist/lab-source.json
      - uses: actions/upload-artifact@v4
        with:
          name: lab-dist
          path: dist/
          retention-days: 7
