name: Refine and verify renderer review
on:
  push:
    branches: [codex/render-light-shadow-pass]
    paths: [.github/workflows/refine-render-once.yml]
permissions:
  contents: read
jobs:
  refine:
    if: github.ref == 'refs/heads/codex/render-light-shadow-pass'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/render-light-shadow-pass
          fetch-depth: 0
      - name: Apply exact scoped correction
        run: |
          python3 - <<'PY'
          import base64,zlib,hashlib,subprocess
          patch=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest()=='d8646ce97105bcc88888d1e683107509d6e34a7007d752fd841653f721c0a1fa'
          paths={line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/')}
          assert paths=={'src/render/skinned.js','tests/browser/render-light.mjs','tests/browser/smoke.mjs','tests/core/rendering.test.js'}
          subprocess.run(['git','merge-base','--is-ancestor','e9fd3c0708652f8c87df673c3fe441d65d3c7a42','HEAD'],check=True)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test && npm run build && git diff --check
      - name: Commit correction on review branch only
        id: commit
        run: |
          rm .github/workflows/refine-render-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/render/skinned.js tests .github/workflows/refine-render-once.yml
          git commit -m 'fix: receive shadows on face and stabilize software-rendered review captures'
          git push origin HEAD:codex/render-light-shadow-pass
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: refine
    uses: ./.github/workflows/render-light.yml
    with:
      review_ref: ${{ needs.refine.outputs.sha }}
