name: Seeker UI Review
on:
  push:
    branches: [codex/seeker-ui-workspaces]
    paths: ['src/**', 'data/**', 'tests/browser/**', 'index.html']
  pull_request:
    paths: ['src/ui/**', 'src/core/skills.js', 'src/core/character.js', 'data/jobtree.json', 'data/skills.json', 'data/mods.json', 'tests/browser/**', 'index.html', '.github/workflows/ui-review.yml']
permissions:
  contents: read
concurrency:
  group: seeker-ui-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Fullscreen travel journal and engraved modifier gems
        run: node tests/browser/journal.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Workspaces and passive touch gestures
        run: node tests/browser/workspaces.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seeker-ui-review-${{ matrix.browser }}
          path: |
            tests/browser/out/workspaces*
            tests/browser/out/journal*
          if-no-files-found: ignore
          retention-days: 7
