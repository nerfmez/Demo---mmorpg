name: Seeker UI Review
on:
  pull_request:
permissions:
  contents: read
  actions: read
concurrency:
  group: seeker-ui-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - name: Validation scope
        run: echo 'Run focused review=${{ steps.scope.outputs.ui }}'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.ui == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.ui == 'true'
      - name: Verify published Lab can be preserved
        if: steps.scope.outputs.ui == 'true' && steps.scope.outputs.tools == 'true' && matrix.browser == 'chromium'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preserve-published-lab.mjs lab-preservation-check
      - run: npm run build
        if: steps.scope.outputs.ui == 'true'
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        if: steps.scope.outputs.ui == 'true'
      - name: Fullscreen travel journal and engraved modifier gems
        if: steps.scope.outputs.ui == 'true'
        run: node tests/browser/journal.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Journal page turns, audio and lifecycle
        if: steps.scope.outputs.ui == 'true'
        run: node tests/browser/skill-journal.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Fullscreen pause governs journal modals
        if: steps.scope.outputs.ui == 'true'
        run: node tests/browser/fullscreen-overlays.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Workspaces and passive touch gestures
        if: steps.scope.outputs.ui == 'true'
        run: node tests/browser/workspaces.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Compact cards and atomic prerequisite route upgrades
        if: steps.scope.outputs.ui == 'true'
        run: node tests/browser/journal-route-upgrade.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Saved character Continue, atomic route allocation, reload and respec
        if: steps.scope.outputs.ui == 'true'
        run: node tests/browser/journal-route-save.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.ui == 'true'
        with:
          name: seeker-ui-review-${{ matrix.browser }}
          path: |
            tests/browser/out/workspaces*
            tests/browser/out/journal*
            tests/browser/out/skill-journal/
            tests/browser/out/fullscreen-overlays-*/
          if-no-files-found: ignore
          retention-days: 7
