name: Seeker UI Review
on:
  # PR execution and the stable check names now belong to CI.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: seeker-ui-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04 # Playwright 1.56 has no browser build for ubuntu-latest (26.04)
    # WebKit twice reached the final passing save assertions at the 22m limit.
    # Keep the full suite; allow finite headroom for software rendering and artifacts.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - name: Validation scope
        run: echo 'Run focused review=${{ steps.scope.outputs.ui }}'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.ui == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.ui == 'true'
      - name: Verify published Lab can be preserved
        if: steps.scope.outputs.ui == 'true' && steps.scope.outputs.tools == 'true' && matrix.browser == 'chromium'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preserve-published-lab.mjs lab-preservation-check
      - run: npm run build
        if: steps.scope.outputs.ui == 'true'
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        if: steps.scope.outputs.ui == 'true'
      - name: Wheel Job Tree journal (sector maps, route ink, job choice, fork, phone)
        if: steps.scope.outputs.ui == 'true'
        run: node tests/browser/wheel-tree.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Fullscreen pause governs journal modals
        if: steps.scope.outputs.ui == 'true'
        run: node tests/browser/fullscreen-overlays.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Workspaces and passive touch gestures
        if: steps.scope.outputs.ui == 'true'
        run: node tests/browser/workspaces.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Wearable character level, crafting and equipped previews
        if: steps.scope.outputs.ui == 'true'
        run: node tests/browser/wearable-level.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Saved character Continue, earlier tree refunded, wheel route, reload and respec
        if: steps.scope.outputs.ui == 'true'
        run: node tests/browser/wheel-save.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.ui == 'true'
        with:
          name: seeker-ui-review-${{ matrix.browser }}
          path: |
            tests/browser/out/workspaces*
            tests/browser/out/wheel-tree-*/
            tests/browser/out/wheel-save/
            tests/browser/out/fullscreen-overlays-*/
          if-no-files-found: ignore
          retention-days: 7
