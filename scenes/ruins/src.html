<title>ทางเข้าซากปรักหักพัง</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>  /* One stage, letterboxed to the concept's 1672:941 frame; a wipe slider compares the 3D scene with the concept. */
  :root {
    --ground: #0f1417;
    --panel: #1a2226;
    --ink: #e9efe9;
    --muted: #9fb0aa;
    --accent: #5fd0c4;
    --font-ui: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--font-ui);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 10px; box-sizing: border-box; overflow: hidden;
  }
  #stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1672 / 941; background: #5f8f43; overflow: hidden; border-radius: 6px; touch-action: none; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .atmo { position: absolute; inset: 0; pointer-events: none; }
  #sunwash { background: radial-gradient(90% 75% at 8% -6%, rgba(255, 238, 196, .12), rgba(255, 238, 196, .04) 45%, rgba(255, 238, 196, 0) 70%); mix-blend-mode: screen; animation: breathe 9s ease-in-out infinite; }
  #rays { background: repeating-linear-gradient(118deg, rgba(255, 246, 214, 0) 0 70px, rgba(255, 246, 214, .045) 70px 120px, rgba(255, 246, 214, 0) 120px 210px); mask-image: radial-gradient(80% 70% at 10% 0%, #000, transparent 75%); -webkit-mask-image: radial-gradient(80% 70% at 10% 0%, #000, transparent 75%); mix-blend-mode: screen; animation: breathe 13s ease-in-out infinite reverse; }
  #vignette { background: radial-gradient(130% 115% at 50% 45%, rgba(0, 0, 0, 0) 62%, rgba(18, 44, 60, .22) 100%); }
  @keyframes breathe { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .atmo { animation: none; } }
  #ref { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
  #divider { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; }
  .tag { position: absolute; top: 8px; padding: 3px 8px; border-radius: 4px; background: rgba(10,16,18,.72); color: var(--ink); font-size: 12px; letter-spacing: .02em; pointer-events: none; }
  #tag3d { left: 8px; } #tagref { right: 8px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; width: 100%; max-width: 1100px; font-size: 14px; }
  .bar label { color: var(--muted); }
  #wipe { flex: 1 1 220px; min-width: 0; accent-color: var(--accent); height: 28px; }
  .seg { display: flex; gap: 6px; }
  .seg button { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid #2e3a3f; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .seg button:focus-visible, #wipe:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { color: var(--muted); font-size: 12px; }

<script type="module">
import * as THREE from 'three';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- page: stage size and the comparison wipe ----------
const stage = document.getElementById('stage'), ref = document.getElementById('ref'), divider = document.getElementById('divider');
const wipe = document.getElementById('wipe');
const ASPECT = 1672 / 941;
function fitStage() {
  const barH = document.querySelector('.bar').offsetHeight + 30;
  const maxW = Math.min(document.body.clientWidth - 32, (window.innerHeight - barH) * ASPECT);
  stage.style.width = Math.max(200, maxW) + 'px';
}
function setWipe(v) {

  divider.style.left = `calc(${v}% - 1px)`;
  divider.hidden = v <= 0 || v >= 100;
  document.getElementById('tag3d').hidden = v <= 0;
  document.getElementById('tagref').hidden = v >= 100;
}
wipe.addEventListener('input', () => setWipe(+wipe.value));
document.getElementById('only3d').onclick = () => setWipe(100);
document.getElementById('half').onclick = () => setWipe(50);
document.getElementById('onlyref').onclick = () => setWipe(0);
const start = new URLSearchParams(location.search).get('wipe');
setWipe(start !== null ? +start : 100);

const status = document.getElementById('status');
let lastStatus = '';
// ---------- helpers ----------
let seed = 20261021;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a, b) => a + (b - a) * rand();
const pick = a => a[Math.floor(rand() * a.length)];
const V3 = THREE.Vector3;
const L = hex => { const c = new THREE.Color(hex); return `vec3(${c.r.toFixed(4)},${c.g.toFixed(4)},${c.b.toFixed(4)})`; };
const smooth = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };

// ---------- renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const MAX_PR = Math.min(window.devicePixelRatio || 1, 1.5);
let pixelRatio = MAX_PR;
renderer.setPixelRatio(pixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;   // redrawn every other frame (see frame())
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#5f8f43');
const camera = new THREE.PerspectiveCamera(32, ASPECT, 1, 400);
// the concept's view: 40 degrees down, close enough that the hero is about 85 px tall in the 941 px frame
const CAM = { target: new V3(0, 0, -7.2), pitch: 40, dist: 72, yaw: 0 };
function placeCamera() {
  const p = THREE.MathUtils.degToRad(CAM.pitch), yw = THREE.MathUtils.degToRad(CAM.yaw);
  camera.position.set(CAM.target.x + Math.sin(yw) * Math.cos(p) * CAM.dist, CAM.target.y + Math.sin(p) * CAM.dist, CAM.target.z + Math.cos(yw) * Math.cos(p) * CAM.dist);
  camera.lookAt(CAM.target);

placeCamera();

// sun: high, from the upper left and slightly behind (shadows fall right and a little toward us)
const SUN = new V3(-0.6, 0.77, -0.2).normalize();
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.target.position.set(0, 0, -21.6); sun.position.copy(SUN).multiplyScalar(90).add(sun.target.position);
scene.add(sun, sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -72, right: 72, top: 76.8, bottom: -76.8, near: 10, far: 348 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.096;

const timeU = { value: 0 };

// ---------- shared GLSL ----------
const NOISE = /* glsl */`
#define SHORE0V 5.8
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x),mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*vnoise(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
// x: distance to the nearest cell point, y: distance to the cell border (web lines at 0)
vec2 voro(vec2 x,float t){vec2 n=floor(x),f=fract(x);float f1=8.,f2=8.;
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=vec2(i,j);vec2 o=hash22(n+g);o=.5+.42*sin(t+6.2831*o);vec2 r=g+o-f;float d=dot(r,r);if(d<f1){f2=f1;f1=d;}else if(d<f2)f2=d;}
  return vec2(sqrt(f1),sqrt(f2)-sqrt(f1));}

// rounded cells: the ratio of the distances to the nearest and second-nearest cell point. Its
// contours are circles (Apollonius), so cells read as rounded blobs; the gaps widen into small
// pools where three cells meet.
float cellGap(vec2 x,float t){ vec2 v=voro(x,t); return v.x/(v.x+v.y+1e-4); }
// the wash: each wave runs up the sand quickly and draws back slowly; the timing drifts along the shore
float zShoreG(float x){ return SHORE0V+0.185*x+0.45*sin(x*0.23)+0.28*sin(x*0.61+1.0); }
// the scene's grade: richer colour and a firmer contrast, in a gamma-2 space so darks keep detail
vec3 gradeBy(vec3 c,float sat,float con){ vec3 g=sqrt(max(c,0.)); float l=dot(g,vec3(.299,.587,.114)); g=mix(vec3(l),g,sat); g=(g-.5)*con+.5; g=max(g,0.); return g*g; }
// the sea keeps the stronger grade; land, foliage and props get only a touch more colour
vec3 grade(vec3 c){ return gradeBy(c,1.2,1.16); }
vec3 gradeLand(vec3 c){ return gradeBy(c,1.04,1.12); }
// soft cloud shadows drifting across the scene with the wind
float cloudShade(vec2 p,float t){ vec2 q=p*.03+vec2(t*.011,t*.005); float n=vnoise(q*2.)*.65+vnoise(q*5.3+3.)*.35; return smoothstep(.5,.64,n); }
float washPhase(float x,float t){ return t*.17+.07*sin(x*.09)+.035*sin(x*.31+1.3); }
float runup(float x,float t){
  float ph=washPhase(x,t),s=fract(ph);
  float reach=1.2+.4*sin(x*.17+floor(ph)*2.3);           // each wave reaches a little differently
  return reach*smoothstep(.0,.22,s)*(1.-smoothstep(.22,1.,s))-.2;
}
`;

// Painted 3-tone light: each material names its own shadow and half-tone tint (warm on sand,
// lavender on stone, deep green on leaves), the shadow map only switches between them.
function paint({ uniforms = {}, sway = null, color = '#ffffff', vertexColors = false, shade = [0.32, 0.32, 0.4], mid = [0.62, 0.6, 0.64], lit = [1, 1, 1], band = [-0.32, 0.26], albedo = '', side = THREE.FrontSide, map = null, alphaTest = 0, extraVert = '', extraVertMain = '', extraFrag = '' } = {}) {
  const m = new THREE.MeshLambertMaterial({ color, vertexColors, side, map, alphaTest });
  const u = { uSway: { value: new THREE.Vector2(...(sway || [0, 0])) }, uSun: { value: SUN }, uShade: { value: new V3(...shade) }, uMid: { value: new V3(...mid) }, uLit: { value: new V3(...lit) }, uBand: { value: new THREE.Vector2(...band) }, uTime: timeU, ...uniforms };
  m.onBeforeCompile = s => {
    Object.assign(s.uniforms, u);
    s.vertexShader = s.vertexShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vW; varying vec3 vWN; uniform float uTime; uniform vec2 uSway;\n${extraVert}`)
      .replace('#include <begin_vertex>', sway ? `#include <begin_vertex>
  { vec3 ip = vec3(0.);
  #ifdef USE_INSTANCING
    ip = instanceMatrix[3].xyz;
  #endif
    float gust = .65 + .7 * max(0., sin(uTime * .45 + ip.x * .07 - ip.z * .04));
    float sw = uSway.x * max(0., position.y - uSway.y) * gust;
    transformed.x += sin(uTime * 1.4 + ip.x * .45 + ip.z * .3) * sw;
    transformed.z += cos(uTime * 1.1 + ip.x * .3 - ip.z * .2) * sw * .6; }` : '#include <begin_vertex>')
      .replace('#include <project_vertex>', `#include <project_vertex>
  { vec4 wp4 = vec4(transformed,1.0); vec3 wn = objectNormal;
  #ifdef USE_INSTANCING
    wp4 = instanceMatrix*wp4; wn = mat3(instanceMatrix)*wn;
  #endif
    wp4 = modelMatrix*wp4; vW = wp4.xyz; vWN = normalize(mat3(modelMatrix)*wn); }
  ${extraVertMain}`);
    s.fragmentShader = s.fragmentShader
      .replace('#include <common>', `#include <common>
uniform vec3 uSun,uShade,uMid,uLit; uniform vec2 uBand; uniform float uTime;
varying vec3 vW; varying vec3 vWN;
${NOISE}
${extraFrag}`)
      .replace('#include <color_fragment>', `#include <color_fragment>
  vec3 gShade=uShade, gMid=uMid, gLit=uLit;
  ${albedo}`)
      .replace('#include <opaque_fragment>', `
  float sh=1.0;
  #if defined( USE_SHADOWMAP ) && NUM_DIR_LIGHT_SHADOWS > 0
    sh = receiveShadow ? getShadow( directionalShadowMap[0], directionalLightShadows[0].shadowMapSize, directionalLightShadows[0].shadowIntensity, directionalLightShadows[0].shadowBias, directionalLightShadows[0].shadowRadius, vDirectionalShadowCoord[0] ) : 1.0;
  #endif

  float ndl=dot(N,uSun);

  float t2=smoothstep(uBand.y-.05,uBand.y+.05,ndl)*sh;
  vec3 base=diffuseColor.rgb;
  vec3 c=mix(base*gShade,base*gMid,t1); c=mix(c,base*gLit,t2);
  c*=mix(vec3(1.),vec3(.8,.83,.94),cloudShade(vW.xz,uTime)*.8);
  outgoingLight=gradeLand(c);
  #include <opaque_fragment>`);
  };
  m.customProgramCacheKey = () => 'paint|' + Object.keys(uniforms).join() + albedo.length + '|' + extraFrag.length + '|' + extraVert.length + '|' + (map ? 1 : 0) + '|' + (sway ? 1 : 0);
  return m;
}
const outlineMat = c => new THREE.MeshBasicMaterial({ color: c, side: THREE.BackSide });

// ---------- faceted grey stones ----------
const STONE = ['#cbc6c2', '#bfbab8', '#d2ccc6', '#b6b1b2', '#c7c1bc', '#bcb7b0'];
const MOSS = ['#a2c64a', '#b4d152', '#8fb843'];
function stoneGeometry(w, h, d, { chamfer = 0.24, jitter = 0.09, extra = 8, moss = 0, base = null, mottle = null } = {}) {
  const pts = [];
  for (let ix = -1; ix <= 1; ix++) for (let iy = -1; iy <= 1; iy++) for (let iz = -1; iz <= 1; iz++) {
    if (!ix && !iy && !iz) continue;
    const k = Math.abs(ix) + Math.abs(iy) + Math.abs(iz);
    const c = k === 3 ? 1 - chamfer : k === 2 ? 1 - chamfer * 0.42 : 1;
    pts.push(new V3(ix * w / 2 * c * (1 + R(-jitter, jitter)), iy * h / 2 * c * (1 + R(-jitter, jitter)), iz * d / 2 * c * (1 + R(-jitter, jitter))));
  }
  for (let i = 0; i < extra; i++) {
    const v = new V3(R(-1, 1), R(-1, 1), R(-1, 1)), m = Math.max(Math.abs(v.x), Math.abs(v.y), Math.abs(v.z));
    v.divideScalar(m).multiplyScalar(1 - chamfer * 0.25);
    pts.push(new V3(v.x * w / 2, v.y * h / 2, v.z * d / 2));
  }
  const g = new ConvexGeometry(pts);
  g.translate(0, h / 2, 0);
  const pos = g.attributes.position, nor = g.attributes.normal, col = new Float32Array(pos.count * 3);
  const baseCol = new THREE.Color(base || pick(STONE)), c = new THREE.Color();
  for (let t = 0; t < pos.count; t += 3) {
    const ny = nor.getY(t);
    c.copy(baseCol).multiplyScalar(1 + R(-0.09, 0.07));
    if (mottle) c.set(pick(mottle)).multiplyScalar(1 + R(-0.08, 0.08));
    else if (ny > 0.78 && rand() < moss) c.lerp(new THREE.Color(pick(MOSS)), R(0.55, 0.8));
    else if (ny > 0.45 && rand() < moss * 0.3) c.lerp(new THREE.Color(pick(MOSS)), 0.3);
    for (let k = 0; k < 3; k++) col.set([c.r, c.g, c.b], (t + k) * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}
const stoneParts = [], stoneLines = [];
const COLLIDERS = [];   // circles the hero walks around: {x, z, r}
function addStone(x, y, z, w, h, d, opts = {}) {
  const g = stoneGeometry(w, h, d, opts);
  const lined = !opts.noLine;
  const m = new THREE.Matrix4().compose(new V3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(opts.rx || 0, opts.ry || 0, opts.rz || 0)), new V3(1, 1, 1));
  g.applyMatrix4(m);
  stoneParts.push(g);
  if (!lined) return;
  // outline shell: the same stone, a little larger, drawn back faces only
  const o = g.clone(); o.deleteAttribute('color');
  const center = new V3(x, y + h / 2, z), s = 1 + 0.06 / Math.min(w, h, d) * 1.6;
  o.translate(-center.x, -center.y, -center.z); o.scale(s, s, s); o.translate(center.x, center.y, center.z);
  stoneLines.push(o);
}

// ---------- foliage from the game (src/render/anime-study.js, nature.js), brighter palette ----------
// Crowns and shrubs are the game's jagged painted patches on arched cards laid along authored
// branch sprays; grass is the game's six-blade meadow clump. Only the palette and the light

const ANIME = {"treeSprays":[[-0.56,0.02,0.05,0.43,0.23,0.36],[0.5,-0.1,0.29,0.36,0.21,0.33],[0.24,0.3,-0.28,0.5,0.28,0.38],[-0.17,0.61,-0.16,0.32,0.26,0.32],[-0.22,-0.12,0.47,0.38,0.17,0.3],[0.72,0.17,-0.15,0.25,0.19,0.24]],"shrubSprays":[[-0.35,0.37,0.14,0.24,0.22,0.25],[0.1,0.65,-0.12,0.33,0.29,0.24],[0.42,0.3,0.2,0.25,0.15,0.21],[-0.39,0.19,-0.19,0.2,0.12,0.18]],"treeCardsPerSpray":18,"shrubCardsPerSpray":13,"treeCardSize":[0.27,0.82],"shrubCardSize":[0.23,0.64],"patchProfiles":[[[20,115],[47,86],[62,91],[58,51],[98,64],[116,22],[146,47],[171,41],[166,78],[223,87],[204,122],[236,148],[195,164],[180,213],[144,197],[110,232],[89,192],[47,207],[52,170],[21,157]],[[21,148],[49,108],[46,74],[85,85],[114,33],[139,54],[177,26],[175,81],[226,60],[207,107],[239,130],[201,156],[205,200],[165,193],[134,227],[111,186],[75,203],[75,163],[40,184]],[[18,122],[49,88],[80,97],[64,55],[106,66],[131,30],[151,74],[192,59],[180,101],[237,112],[199,148],[219,182],[170,174],[169,215],[125,191],[95,229],[81,185],[33,187],[51,146]],[[30,83],[79,86],[94,35],[124,68],[166,41],[156,89],[219,85],[193,119],[236,148],[198,172],[161,163],[170,215],[128,190],[103,229],[91,185],[44,196],[62,151],[19,128]]],"trunk":{"sides":9,"outlineWidth":0.013,"spine":[[0,0,0,0.48],[0.06,0.32,0.015,0.34],[-0.07,1.05,0.04,0.25],[0.1,1.85,0.015,0.21],[0.02,2.6,-0.04,0.155],[-0.15,3.35,-0.07,0.105],[-0.2,4.1,-0.2,0.045]],"roots":[[[0.03,0.4,0,0.21],[0.43,0.14,0.22,0.12],[0.8,0.035,0.35,0.015]],[[0,0.36,0,0.22],[-0.36,0.13,0.38,0.13],[-0.63,0.03,0.66,0.012]],[[0,0.3,0,0.2],[-0.24,0.12,-0.38,0.13],[-0.42,0.03,-0.65,0.015]]],"creases":[[0.45,0.13,0.84,0.034],[1.8,0.3,1.52,0.025],[3.4,0.1,0.75,0.038],[5.0,0.7,2.15,0.024]]}};
const FOL = {
  leaf: ['#1f513b', '#3f8a37', '#a3d04a'], shrub: ['#215640', '#4a9739', '#b0d952'],
  trunk: { light: '#bf9677', mid: '#96705b', shadow: '#68504a', line: '#57413b' },
};
const mkRng = s => { let a = s >>> 0; const next = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; return { range: (lo, hi) => lo + (hi - lo) * next() }; };
const maps = new Map();
function branchletTexture(shrub = false) {
  if (maps.has(shrub)) return maps.get(shrub);
  const canvas = document.createElement('canvas'); canvas.width = canvas.height = 512;
  const ctx = canvas.getContext('2d'), rng = mkRng(shrub ? 708 : 391);

  const mat = new THREE.MeshBasicMaterial({ color: '#ffffff', side: THREE.DoubleSide });
